<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISL sign to text (browser)</title>
<style>
  :root { --bg: #14161a; --panel: #1e2127; --ink: #f2f2f2; --muted: #9aa0a6; --accent: #4fa3ff; --good: #7bd88f; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 12px; }
  canvas { width: 100%; background: #000; border-radius: 10px; display: block; }
  .row { display: flex; gap: 8px; align-items: center; margin: 12px 0; flex-wrap: wrap; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 10px 16px; font-size: 16px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #status { color: var(--muted); }
  #result { background: var(--panel); border-radius: 10px; padding: 12px 16px; min-height: 90px; }
  #result .top { font-size: 28px; color: var(--good); font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>ISL sign to text</h1>
  <p>Runs fully in the browser: MediaPipe finds the hands and face, the BiLSTM (ONNX) picks the sign.</p>
  <canvas id="view" width="640" height="480"></canvas>
  <div class="row">
    <button id="record" disabled>Record a sign (space)</button>
    <label>or test on a video file <input type="file" id="file" accept="video/*"></label>
    <span id="status">Loading models…</span>
  </div>
  <div id="result"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
<script type="module">
import { FilesetResolver, HandLandmarker, FaceLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
import { preprocess, topK } from "./preprocess.js";

const COUNTDOWN = 2.0, SECONDS = 2.5;          // same as live_demo.py and Mudra Bubbles
const params = new URLSearchParams(location.search);
const view = document.getElementById("view"), ctx = view.getContext("2d", { willReadFrequently: true });
const statusEl = document.getElementById("status"), resultEl = document.getElementById("result");
const recordBtn = document.getElementById("record");
const video = document.createElement("video");
video.muted = true; video.playsInline = true;
window.video = video;                              // handy for debugging in the console

// Models: the .task files from the repo root, the BiLSTM from web/model
const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
const hands = await HandLandmarker.createFromOptions(vision, {   // same settings as mpipe.py
  baseOptions: { modelAssetPath: "../hand_landmarker.task", delegate: "CPU" },
  runningMode: "VIDEO", numHands: 2,
  minHandDetectionConfidence: 0.6, minHandPresenceConfidence: 0.6, minTrackingConfidence: 0.5,
});
const face = await FaceLandmarker.createFromOptions(vision, {
  baseOptions: { modelAssetPath: "../face_landmarker.task", delegate: "CPU" },
  runningMode: "VIDEO", numFaces: 1, minFaceDetectionConfidence: 0.5, minTrackingConfidence: 0.5,
});
const cfg = await (await fetch("model/config.json")).json();
ort.env.wasm.wasmPaths = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/";
const session = await ort.InferenceSession.create("model/model.onnx");

const zeros = (n) => Array.from({ length: n }, () => [0, 0, 0]);
let state = "idle", t0 = 0, take = [], lastTs = 0;

// One frame: mirror it (like mpipe.py), then find hands and face.
function detect() {
  ctx.save(); ctx.translate(view.width, 0); ctx.scale(-1, 1);
  ctx.drawImage(video, 0, 0, view.width, view.height);
  ctx.restore();
  const ts = Math.max(performance.now(), lastTs + 1); lastTs = ts;
  const frame = { hands: [zeros(21), zeros(21)], handsScreen: [zeros(21), zeros(21)], face: null };
  const h = hands.detectForVideo(view, ts);
  h.worldLandmarks.forEach((world, i) => {
    const slot = h.handedness[i][0].categoryName === "Right" ? 0 : 1;   // mpipe.py's slots
    frame.hands[slot] = world.map((p) => [p.x, p.y, p.z]);
    frame.handsScreen[slot] = h.landmarks[i].map((p) => [p.x, p.y, p.z]);
  });
  if (cfg.with_position) {
    const f = face.detectForVideo(view, ts);
    if (f.faceLandmarks.length) frame.face = f.faceLandmarks[0].map((p) => [p.x, p.y, p.z]);
  }
  ctx.fillStyle = "#4fa3ff";
  for (const pts of h.landmarks) for (const p of pts) ctx.fillRect(p.x * view.width - 2, p.y * view.height - 2, 4, 4);
  return frame;
}

async function classify(frames) {
  if (frames.every((f) => f.hands.every((hd) => hd.every((p) => !p[0] && !p[1] && !p[2])))) {
    resultEl.innerHTML = "No hands seen. Keep both hands in the camera and try again.";
    return null;
  }
  const x = preprocess(frames, cfg);
  const out = await session.run({ features: new ort.Tensor("float32", x, [1, cfg.seq_len, cfg.n_features]) });
  const top = topK(out.logits.data, cfg.labels, 3);
  const pretty = (w) => w.replaceAll("_", " ");
  resultEl.innerHTML = `<div class="top">${pretty(top[0].label).toUpperCase()}</div>` +
    top.map((t, i) => `${i + 1}. ${pretty(t.label)} ${(t.p * 100).toFixed(0)}%`).join("<br>");
  return top;
}

function loop() {
  if (video.readyState >= 2) {
    const now = performance.now() / 1000;
    if (state === "recording") {
      take.push(detect());
      const left = SECONDS - (now - t0);
      statusEl.textContent = `Sign now (${Math.max(0, left).toFixed(1)} s)`;
      // A fixed length in seconds, not frames: a slow webcam just gives fewer frames
      if (left <= 0 && take.length >= 2) {
        state = "idle"; statusEl.textContent = `${take.length} frames`;
        classify(take).then((top) => { window.lastResult = top; });
      }
    } else if (state !== "testing") {
      detect();
      if (state === "countdown") {
        const left = COUNTDOWN - (now - t0);
        statusEl.textContent = `Get ready: ${left.toFixed(1)} s`;
        if (left <= 0) { state = "recording"; t0 = now; take = []; }
      }
    }
  }
  requestAnimationFrame(loop);
}

function startTake() {
  if (state !== "idle") return;
  state = "countdown"; t0 = performance.now() / 1000; resultEl.innerHTML = "";
}

async function useSource(src) {
  if (src instanceof MediaStream) video.srcObject = src; else { video.srcObject = null; video.src = src; video.loop = true; }
  await video.play();
  view.width = 640; view.height = Math.round(640 * video.videoHeight / video.videoWidth) || 480;
  recordBtn.disabled = false; statusEl.textContent = "Ready";
}

recordBtn.onclick = startTake;
document.addEventListener("keydown", (e) => { if (e.code === "Space") { e.preventDefault(); startTake(); } });
document.getElementById("file").onchange = (e) => e.target.files[0] && useSource(URL.createObjectURL(e.target.files[0]));

requestAnimationFrame(loop);
if (params.get("video")) {                     // testing: ?video=<path>&auto=1 records one take by itself
  await useSource(params.get("video"));
  if (params.get("auto")) {                    // every frame of the clip is one take, no countdown
    state = "testing"; video.pause(); video.loop = false;
    const frames = [], fps = Number(params.get("fps") || 30);
    const end = Number(params.get("seconds")) || video.duration;
    for (let t = 0.5 / fps; t < end; t += 1 / fps) {
      video.currentTime = t;
      await new Promise((r) => video.addEventListener("seeked", r, { once: true }));
      frames.push(detect());
    }
    statusEl.textContent = `${frames.length} frames`;
    window.lastResult = await classify(frames);
    state = "idle";
  }
} else {
  try { await useSource(await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } })); }
  catch (err) { statusEl.textContent = "No camera: choose a video file instead"; }
}
</script>
</body>
</html>
